name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF304F&color_dots=#EBEDF0,#FFB3BD,#FF6B7D,#FF304F,#B3122A
            dist/github-snake-dark.svg?color_snake=#FF304F&color_dots=#161B22,#3A0D12,#7A1420,#B31E2D,#FF304F

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
